services:
  api:
    build: ./api
    ports: ["${API_PORT:-8000}:8000"]
    environment: ["CORS_ORIGIN=http://localhost:5173", "STORE_BACKEND=dynamodb", "QUEUE_BACKEND=dynamodb", "ASYNC_PROCESSING=true", "DYNAMODB_ENDPOINT=http://dynamodb:8000", "DYNAMODB_TABLE=sdi-documents", "OBJECT_STORE_ENDPOINT=http://minio:9000", "OBJECT_STORE_BUCKET=sdi-quarantine", "OBJECT_STORE_CLEAN_BUCKET=sdi-clean", "MINIO_ACCESS_KEY=localaccess", "MINIO_SECRET_KEY=localsecret123", "ADAPTER_MODE=${ADAPTER_MODE:-fixture}", "MODEL_ADAPTER=${MODEL_ADAPTER:-}", "CLAMAV_HOST=clamav", "OLLAMA_ENDPOINT=http://ollama:11434/api/generate"]
    volumes: ["sdi-data:/data"]
    user: "10001:10001"
    depends_on:
      state-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      dynamodb: {condition: service_started}
  worker:
    build: ./api
    command: ["python", "-m", "app.worker"]
    environment: ["STORE_BACKEND=dynamodb", "QUEUE_BACKEND=dynamodb", "ASYNC_PROCESSING=true", "DYNAMODB_ENDPOINT=http://dynamodb:8000", "DYNAMODB_TABLE=sdi-documents", "OBJECT_STORE_ENDPOINT=http://minio:9000", "OBJECT_STORE_BUCKET=sdi-quarantine", "OBJECT_STORE_CLEAN_BUCKET=sdi-clean", "MINIO_ACCESS_KEY=localaccess", "MINIO_SECRET_KEY=localsecret123", "ADAPTER_MODE=${ADAPTER_MODE:-fixture}", "MODEL_ADAPTER=${MODEL_ADAPTER:-}", "CLAMAV_HOST=clamav", "OLLAMA_ENDPOINT=http://ollama:11434/api/generate"]
    depends_on: [api, dynamodb, minio-init]
    user: "10001:10001"
  ui:
    build: ./frontend
    ports: ["${UI_PORT:-5173}:80"]
    depends_on: [api]
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    environment: ["MINIO_ROOT_USER=localaccess", "MINIO_ROOT_PASSWORD=localsecret123"]
  minio-init:
    image: minio/mc:RELEASE.2025-02-15T10-36-16Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 localaccess localsecret123; do sleep 1; done; mc mb --ignore-existing local/sdi-quarantine; mc mb --ignore-existing local/sdi-clean"]
  state-init:
    image: alpine:3.21
    user: "0:0"
    volumes: ["sdi-data:/data"]
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: -jar DynamoDBLocal.jar -dbPath /home/dynamodblocal -sharedDb
    volumes: ["dynamodb-data:/home/dynamodblocal"]
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scanners"]
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["ai"]
volumes:
  sdi-data:
  dynamodb-data:
